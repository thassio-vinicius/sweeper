name: sweeper_game
description: Game domain, data, and presentation for Reversed Minesweeper.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  go_router: ^15.1.2
  web_socket_channel: ^3.0.2
  sweeper_auth:
    path: ../sweeper_auth
  sweeper_l10n:
    path: ../sweeper_l10n
  sweeper_settings:
    path: ../sweeper_settings
  sweeper_theme:
    path: ../sweeper_theme

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
